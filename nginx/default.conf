log_format goodetc '$remote_addr [$time_local] host="$host" http_host="$http_host" '
                   'request="$request" status=$status location="$sent_http_location" '
                   'referer="$http_referer" ua="$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name 127.0.0.1;
    access_log /var/log/nginx/access.log goodetc;

    location ~* ^/home\.htmlhttps {
        return 302 http://localhost:8085/home.html;
    }

    location / {
        return 302 http://localhost:8085$request_uri;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _;
    access_log /var/log/nginx/access.log goodetc;

    root /usr/share/nginx/html;
    index index.html index.htm;

    location ~* ^/home\.htmlhttps {
        return 302 /home.html;
    }

    location /api/ {
        proxy_pass http://game-server:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
